name = "perfume-landing"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "perfume_db"
database_id = "perfume-db-local-id"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
META_PIXEL_ID = "123456789012345"
# Cloudflare Turnstile Invisible Always-Pass Site Key for dev
TURNSTILE_SITE_KEY = "1x00000000000000000000BB"
META_TEST_EVENT_CODE = ""
CAPI_EVENT_NAME = "Purchase"
