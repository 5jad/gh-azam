<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a2015"/>
      <stop offset="70%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a671c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow3)"/>

  <!-- Botanical / Fragrance Elements Illustration -->
  <g transform="translate(400, 380)">
    <!-- Concentric Scent Waves -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="rgba(212,175,55,0.08)" stroke-width="1.5" stroke-dasharray="8,8"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="url(#goldGrad3)" opacity="0.15"/>

    <!-- Central Scent Emblem -->
    <circle cx="0" cy="0" r="50" fill="#1b1814" stroke="url(#goldGrad3)" stroke-width="2"/>
    <path d="M 0,-25 C 15,-5 25,10 0,30 C -25,10 -15,-5 0,-25 Z" fill="url(#goldGrad3)"/>

    <!-- 3 Notes Pills -->
    <!-- Top Notes -->
    <g transform="translate(0, -170)">
      <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#1e1b18" stroke="url(#goldGrad3)" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Tajawal', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">القمة: برغموت وهيل نقي</text>
    </g>

    <!-- Heart Notes -->
    <g transform="translate(-160, 50)">
      <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#1e1b18" stroke="url(#goldGrad3)" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Tajawal', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">القلب: خشب الصندل والياسمين</text>
    </g>

    <!-- Base Notes -->
    <g transform="translate(160, 50)">
      <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#1e1b18" stroke="url(#goldGrad3)" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Tajawal', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">القاعدة: عنبر وعود ملكي</text>
    </g>

    <text x="0" y="220" font-family="'Tajawal', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ثبات وفوحان يتجاوز 24 ساعة</text>
    <text x="0" y="250" font-family="'Tajawal', serif" font-size="14" fill="#d4af37" text-anchor="middle">زيوت عطرية فرنسية نقية 100%</text>
  </g>
</svg>
