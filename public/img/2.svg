<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#241e17"/>
      <stop offset="70%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a671c"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow2)"/>

  <!-- Pedestal -->
  <ellipse cx="400" cy="690" rx="240" ry="25" fill="#000000" opacity="0.6"/>

  <!-- Luxury Packaging Box -->
  <g filter="url(#shadow2)">
    <!-- Box Body -->
    <rect x="250" y="220" width="300" height="430" rx="12" fill="#18181c" stroke="url(#goldGrad2)" stroke-width="2"/>
    <rect x="270" y="240" width="260" height="390" rx="6" fill="#121215" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>

    <!-- Gold Ribbon/Band -->
    <rect x="250" y="410" width="300" height="40" fill="url(#goldGrad2)" opacity="0.9"/>
    
    <!-- Crest/Emblem -->
    <circle cx="400" cy="330" r="45" fill="#1e1c18" stroke="url(#goldGrad2)" stroke-width="2"/>
    <text x="400" y="342" font-family="'Tajawal', serif" font-size="32" font-weight="bold" fill="url(#goldGrad2)" text-anchor="middle">A</text>

    <!-- Box Typography -->
    <text x="400" y="435" font-family="'Tajawal', serif" font-size="16" font-weight="bold" fill="#0d0d0f" text-anchor="middle" letter-spacing="4">LUXURY PACKAGING</text>
    <text x="400" y="500" font-family="'Tajawal', serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">AZAM ROYAL</text>
    <text x="400" y="535" font-family="'Tajawal', serif" font-size="14" fill="#d4af37" text-anchor="middle">تغليف ملكي فاخر - هدية مثالية</text>
    <text x="400" y="565" font-family="'Tajawal', serif" font-size="12" fill="#888888" text-anchor="middle">معبأ بأحدث المعايير العالمية</text>
  </g>
</svg>
