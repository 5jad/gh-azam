<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#dfba53"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="70%" stop-color="rgba(212,175,55,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Pedestal Reflection -->
  <ellipse cx="400" cy="690" rx="220" ry="25" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="685" rx="160" ry="12" fill="url(#goldGrad)" opacity="0.2"/>

  <!-- Perfume Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="365" y="160" width="70" height="75" rx="6" fill="url(#goldGrad)"/>
    <rect x="360" y="235" width="80" height="15" rx="3" fill="#8f6b1a"/>

    <!-- Neck / Sprayer -->
    <rect x="375" y="250" width="50" height="25" fill="url(#goldGrad)"/>

    <!-- Bottle Body (Crystal glass) -->
    <path d="M 280,310 C 280,285 300,275 375,275 L 425,275 C 500,275 520,285 520,310 L 520,630 C 520,650 500,660 480,660 L 320,660 C 300,660 280,650 280,630 Z" fill="#1b1715"/>
    <path d="M 280,310 C 280,285 300,275 375,275 L 425,275 C 500,275 520,285 520,310 L 520,630 C 520,650 500,660 480,660 L 320,660 C 300,660 280,650 280,630 Z" fill="url(#glassGrad)"/>
    <path d="M 280,310 C 280,285 300,275 375,275 L 425,275 C 500,275 520,285 520,310 L 520,630 C 520,650 500,660 480,660 L 320,660 C 300,660 280,650 280,630 Z" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

    <!-- Luxury Label -->
    <rect x="325" y="400" width="150" height="180" rx="8" fill="#121113" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <rect x="333" y="408" width="134" height="164" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4,2"/>
    
    <!-- Label Typography -->
    <text x="400" y="455" font-family="'Tajawal', 'Cairo', serif" font-size="14" fill="#d4af37" text-anchor="middle" letter-spacing="4">EAU DE PARFUM</text>
    <text x="400" y="495" font-family="'Tajawal', 'Cairo', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AZAM</text>
    <line x1="365" y1="515" x2="435" y2="515" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="400" y="540" font-family="'Tajawal', 'Cairo', serif" font-size="13" fill="#d4af37" text-anchor="middle" letter-spacing="3">ROYAL EDITION</text>
    <text x="400" y="560" font-family="'Tajawal', 'Cairo', serif" font-size="11" fill="#888888" text-anchor="middle">100 ML - 3.4 FL.OZ</text>

    <!-- Glass Highlights -->
    <path d="M 295,320 L 295,640" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 305,330 L 305,620" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  </g>
</svg>
