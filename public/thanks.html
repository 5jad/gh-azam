<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>تم استلام طلبك بنجاح | عطور عزام الشمري</title>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
  </script>

  <style>
    .thanks-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .thanks-card {
      width: 100%;
      max-width: 580px;
      background: #ffffff;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-float);
    }
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: var(--success-tint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--success);
    }
    .order-code-box {
      display: inline-block;
      background: var(--bg-surface);
      border: 1px solid var(--hairline-dark);
      color: var(--text-primary);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 0.5rem 1.5rem;
      border-radius: var(--radius-pill);
      margin: 1.25rem 0;
      direction: ltr;
    }
    .order-summary-card {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin: 1.75rem 0;
      text-align: right;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 0.95rem;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-item .label {
      color: var(--text-secondary);
    }
    .summary-item .val {
      font-weight: 600;
      color: var(--text-primary);
    }
    .thanks-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    @media (min-width: 480px) {
      .thanks-actions {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo" id="thanks-brand-name">عطور عزام الشمري</a>
    </div>
  </header>

  <div class="thanks-wrapper">
    <div class="thanks-card" id="thanks-content">
      <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 style="font-size: 1.85rem; font-weight: 600; letter-spacing: -0.02em;">تم استلام طلبك بنجاح!</h1>
      <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 1.05rem;">
        سنتصل بك قريباً لتأكيد موعد التسليم.
      </p>

      <div>
        <div class="order-code-box" id="order-code-display">...</div>
      </div>

      <!-- Order Details Summary -->
      <div class="order-summary-card" id="order-details-box">
        <div class="summary-item">
          <span class="label">العميل:</span>
          <span class="val" id="order-customer-name">-</span>
        </div>
        <div class="summary-item">
          <span class="label">الهاتف:</span>
          <span class="val" id="order-phone" dir="ltr">-</span>
        </div>
        <div class="summary-item">
          <span class="label">العنوان:</span>
          <span class="val" id="order-address">-</span>
        </div>
        <div class="summary-item" id="order-location-row" style="display: none;">
          <span class="label">الخريطة:</span>
          <span class="val"><a href="#" id="order-map-link" target="_blank" style="color: var(--accent);">📍 فتح الموقع في Google Maps</a></span>
        </div>
        <div class="summary-item">
          <span class="label">المنتجات:</span>
          <span class="val" id="order-items-list">-</span>
        </div>
        <div class="summary-item">
          <span class="label">التوصيل:</span>
          <span class="val" style="color: #15803d;">مجاني</span>
        </div>
        <div class="summary-item" style="font-size: 1.15rem; font-weight: 600; border-top: 1px solid var(--hairline); margin-top: 0.5rem; padding-top: 0.75rem;">
          <span class="label" style="color: var(--text-primary);">المطلوب عند الاستلام:</span>
          <span class="val" id="order-total-price">-</span>
        </div>
      </div>

      <div class="cod-badge" style="justify-content: center; margin-bottom: 1.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span>الدفع نقداً عند الاستلام بعد معاينة الطرد والتأكد من العطر</span>
      </div>

      <div class="thanks-actions">
        <a href="/" class="btn-primary-pill" style="flex: 1; font-size: 0.95rem; padding: 0.8rem 1rem;">العودة للمتجر</a>
        <a href="#" id="thanks-whatsapp-btn" class="footer-whatsapp-link" style="flex: 1; font-size: 0.95rem; padding: 0.8rem 1rem; margin-bottom: 0; justify-content: center; display: none;" target="_blank">
          <span>تواصل واتساب</span>
        </a>
      </div>
    </div>
  </div>

  <script src="/thanks.js" defer></script>
</body>
</html>
